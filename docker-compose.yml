version: '3.8'

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: mini_payment_postgres
    restart: always
    environment:
      POSTGRES_DB: mini_payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: mini_payment_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres_db

  redis_cache:
    image: redis:7-alpine
    container_name: mini_payment_redis
    ports:
      - "6379:6379"

  elasticsearch:
    image: elasticsearch:7.17.18
    container_name: mini_payment_es
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: kibana:7.17.18
    container_name: mini_payment_kibana
    restart: always
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

  app:
    build: ./mini-payment
    container_name: mini_payment_app
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_db:5432/mini_payment_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATA_REDIS_HOST: redis_cache
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
    depends_on:
      - postgres_db
      - redis_cache
      - elasticsearch

  ab_bench:
    image: httpd:alpine
    container_name: mini_payment_ab
    volumes:
      - .:/apps
    working_dir: /apps
    profiles: [ "tools" ]

volumes:
  postgres_data:
  es_data: