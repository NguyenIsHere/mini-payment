server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/mini_payment_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-SYSTEM}] %logger{36} - %msg%n
logging.level.root=INFO
logging.level.com.example.mini_payment=INFO