server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/mini_payment_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# CỰC KỲ QUAN TRỌNG: Cơ chế tạo bảng tự động
# - update: Tự động tạo bảng nếu chưa có, hoặc thêm cột mới (Dùng khi đang Dev)
# - validate: Chỉ kiểm tra xem Entity có khớp với DB không, không tự tạo bảng (Dùng cho Production)
spring.jpa.hibernate.ddl-auto=update

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId}] - %msg%n